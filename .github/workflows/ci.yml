name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install backend deps
        working-directory: backend
        run: uv sync --all-extras
      - name: Lint (ruff)
        working-directory: backend
        run: uv run ruff check app tests
      - name: Tests (pytest)
        working-directory: backend
        run: uv run pytest -q
      - name: Export OpenAPI (contract check)
        working-directory: backend
        run: uv run python -c "from app.main import create_app; import yaml; app=create_app(); yaml.safe_dump(app.openapi(), open('../openapi.yaml','w'), sort_keys=False)"
      - name: Verify openapi.yaml is up to date
        run: git diff --exit-code openapi.yaml || (echo "::error::openapi.yaml drift — run the export step locally and commit"; git diff openapi.yaml; exit 1)

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Unit tests (Vitest)
        working-directory: frontend
        run: npm test
      - name: Type check + build
        working-directory: frontend
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Build full stack (compose)
        run: docker compose config -q && docker compose build
      # Uncomment to push on pass — configure RENDER_API_KEY / DockerHub secrets first:
      # - name: Deploy to Render (example)
      #   if: success()
      #   run: curl -X POST "$RENDER_DEPLOY_HOOK"
      #   env:
      #     RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
