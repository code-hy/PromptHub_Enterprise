# PromptHub Enterprise — full containerised stack.
#
# The primary local demo path does NOT need Docker (backend defaults to
# SQLite + a deterministic mock LLM). This compose file provides the
# production-style topology: postgres, qdrant, ollama, backend, frontend.

name: prompthub-enterprise

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: prompthub
      POSTGRES_PASSWORD: prompthub
      POSTGRES_DB: prompthub
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prompthub"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    # Optional but useful for GPU hosts. Uncomment for Nvidia:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://prompthub:prompthub@postgres:5432/prompthub
      RAG_MODE: qdrant
      QDRANT_URL: http://qdrant:6333
      LLM_PROVIDER: ollama
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: qwen3
      SECRET_KEY: change-me-in-production
      ENABLE_AUTH: "false"
      SEED_DEMO_DATA: "true"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      ollama:
        condition: service_started
    ports:
      - "8010:8000"
    command: >
      sh -c "uv run python -c \"from app.seed import seed_all; seed_all()\" &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8010/api/v1
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  pg_data:
  qdrant_data:
  ollama_data: