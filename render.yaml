# Render Blueprint — PromptHub Enterprise (Free-tier)
# Docs: https://render.com/docs/blueprint-spec
# DATABASE: Neon free PostgreSQL (permanent) — set DATABASE_URL manually on the
#   prompthub-api service (see Cloud_Deployment.md "Option B — Neon"). The old
#   Render free `prompthub-db` was deleted (2026-10-10 incident: dpg-* hostname
#   unresolvable → backend crash-loop), so this blueprint no longer provisions it.
# Free-tier notes:
#   - Web Services on Free sleep after 15 min inactivity (cold start ~30-50s),
#     750 hrs/month, 512 MB RAM. First request after sleep will be slow — expected.
#   - Dockerfiles now respect $PORT (Render sets 10000); local dev still uses :8010.
#   - For cheapest free deploys, use Backend as Web Service (free) + Frontend as
#     Static Site (free, 100 GB/mo) instead of second Docker service — see below.

services:
  - type: web
    name: prompthub-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      # Neon (set manually on the service — never commit the secret here).
      # Paste the Neon pooled connection string as DATABASE_URL, e.g.
      # postgresql://USER:PASS@ep-xxx.us-east-2.aws.neon.tech/prompthub?sslmode=require
      # (app auto-normalizes to the +psycopg driver; see backend/app/config.py).
      - key: LLM_PROVIDER
        value: mock
      - key: SEED_DEMO_DATA
        value: true
      - key: SECRET_KEY
        generateValue: true
      - key: ENABLE_AUTH
        value: false

  # Option A: Frontend as Docker Web Service (sleepy but simple, same repo).
  # For free-tier we recommend Option B (Static Site) below — cheaper and faster.
  # Keep this entry if you want Blueprint to create both services; or delete it
  # and create a Static Site manually (see ops/render.md).
  - type: web
    name: prompthub-web
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    # Bake the live backend host at build time so the preview doesn't call localhost
    buildArgs:
      - key: VITE_API_URL
        value: https://prompthub-api-56ez.onrender.com/api/v1
    envVars:
      - key: VITE_API_URL
        value: https://prompthub-api-56ez.onrender.com/api/v1

