# Render Blueprint — PromptHub Enterprise
# Docs: https://render.com/docs/blueprint-spec
# Deploys: Postgres + Backend (FastAPI :10000) + Frontend (Vite preview).
# Local dev still uses :8010 (see README.md:34); Render uses $PORT internally.

services:
  - type: web
    name: prompthub-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: prompthub-db
          property: connectionString
      - key: LLM_PROVIDER
        value: mock
      - key: SEED_DEMO_DATA
        value: true
      - key: SECRET_KEY
        generateValue: true
      - key: ENABLE_AUTH
        value: false

  - type: web
    name: prompthub-web
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    plan: starter
    envVars:
      - key: VITE_API_URL
        fromService:
          name: prompthub-api
          type: web
          property: host
        # Render injects https://<host>; frontend Dockerfile bakes VITE_API_URL at build time.
        # For host-based routing, the Docker build will use https://prompthub-api.onrender.com/api/v1

databases:
  - name: prompthub-db
    plan: starter
    databaseName: prompthub
    user: prompthub
